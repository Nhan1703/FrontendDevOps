version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: thenhanshop-backend
    restart: always
    environment:
      - PORT=5000
      - DB_SERVER=den1.mssql8.gear.host
      - DB_DATABASE=backenddevops
      - DB_USER=backenddevops
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_PORT=1433
    ports:
      - "5000:5000"
    networks:
      - app-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: thenhanshop-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"
      - "3000:3000"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
